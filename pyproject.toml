[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "androserum"
version = "0.12.0"
description = "Traceable Android program facts and behavior analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.14,<3"]

[project.optional-dependencies]
extraction = ["androguard==4.1.4"]
encoding = ["torch==2.8.0", "numpy==2.2.6", "transformers==4.57.1", "tokenizers==0.22.1", "huggingface-hub==0.36.0", "safetensors==0.6.2"]
test = ["pytest>=9,<10", "jsonschema>=4.26,<5"]

[project.scripts]
androserum = "androserum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"androserum.mining" = ["prompt.txt"]
"androserum.matching" = ["prompt.txt", "legacy-prompt.json"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-ra"
